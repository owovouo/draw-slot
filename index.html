<!DOCTYPE html>
<html lang="zh-TW" data-theme="lucky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 主題拉霸機</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ─────────────────────────────────────────────
   Theme: LUCKY (default)  紅金卡通風
───────────────────────────────────────────── */
:root, [data-theme="lucky"] {
  --bg-base: #FFF6F1;
  --bg-grad: radial-gradient(120% 90% at 50% 0%, #FFF8F1 0%, #FCE8DE 55%, #F8D4C6 100%);
  --surface: #FFFFFF;
  --surface2: #FFF6EE;
  --border: rgba(180, 60, 70, 0.18);
  --text: #2B3450;
  --text-dim: #8C8C9C;
  --text-em: #14213D;

  --primary: #E63946;          /* 機身亮紅 */
  --primary-dark: #C12C36;
  --primary-darker: #9B1F28;
  --primary-glow: rgba(230, 57, 70, 0.14);

  --gold: #E8C766;
  --gold-bright: #F4D77E;
  --gold-dark: #B8932E;
  --gold-glow: rgba(232, 199, 102, 0.45);

  --red: #E63946;
  --green: #2A9D8F;

  --radius: 18px;
  --radius-sm: 12px;
  --shadow-lg: 0 30px 60px -20px rgba(193, 44, 54, 0.35), 0 12px 28px rgba(0,0,0,0.08);
  --shadow-card: 0 8px 28px -8px rgba(193, 44, 54, 0.18), 0 2px 6px rgba(0,0,0,0.04);
  --transition: 0.2s ease;

  --reel-bg: #FAF7F2;
  --reel-text: #14213D;

  --machine-grad: linear-gradient(180deg, #EF4651 0%, #D9303C 45%, #B8222C 100%);
  --machine-border: #8E1820;

  --light-size: 9px;
}

/* ─────────────────────────────────────────────
   Theme: DARK (保留)
───────────────────────────────────────────── */
[data-theme="dark"] {
  --bg-base: #07080F;
  --bg-grad: radial-gradient(120% 90% at 50% 0%, #0A1424 0%, #07080F 60%, #050608 100%);
  --surface: #0D0E18;
  --surface2: #131520;
  --border: rgba(0,180,216,0.22);
  --text: #8AAEBB;
  --text-dim: #4A6070;
  --text-em: #D8EEFF;
  --primary: #00B4D8;
  --primary-dark: #007A96;
  --primary-darker: #003E5C;
  --primary-glow: rgba(0,180,216,0.18);
  --gold: #FFD166;
  --gold-bright: #FFE8A0;
  --gold-dark: #B89540;
  --gold-glow: rgba(255,209,102,0.30);
  --red: #FF4D6D;
  --green: #06D6A0;
  --shadow-lg: 0 0 60px rgba(0,180,216,0.18), 0 20px 60px rgba(0,0,0,0.8);
  --shadow-card: 0 0 24px rgba(0,180,216,0.12), 0 8px 24px rgba(0,0,0,0.6);
  --reel-bg: #040608;
  --reel-text: #A8E8FF;
  --machine-grad: linear-gradient(145deg,#0A0E18,#07080F,#0A1020);
  --machine-border: #00B4D8;
}

/* ─────────────────────────────────────────────
   Base
───────────────────────────────────────────── */
html { font-size: 19.5px; scroll-behavior: smooth; }
body {
  background: var(--bg-base);
  background-image: var(--bg-grad);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 64px;
  position: relative;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
}

/* 星芒裝飾 */
:root:not([data-theme="dark"]) body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(230,57,70,0.35) 0, transparent 1.5px),
    radial-gradient(circle at 22% 9%, rgba(232,199,102,0.55) 0, transparent 2px),
    radial-gradient(circle at 88% 14%, rgba(230,57,70,0.4) 0, transparent 1.5px),
    radial-gradient(circle at 79% 6%, rgba(232,199,102,0.5) 0, transparent 2px),
    radial-gradient(circle at 8% 65%, rgba(232,199,102,0.45) 0, transparent 2px),
    radial-gradient(circle at 14% 82%, rgba(230,57,70,0.3) 0, transparent 1.5px),
    radial-gradient(circle at 92% 58%, rgba(230,57,70,0.35) 0, transparent 1.5px),
    radial-gradient(circle at 86% 78%, rgba(232,199,102,0.5) 0, transparent 2px);
}

input,textarea,select,button { font-family: inherit; font-size: inherit; }

/* ─────────────────────────────────────────────
   Header
───────────────────────────────────────────── */
.app-header {
  width: 100%; max-width: 720px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
  position: relative; z-index: 2;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 1.05rem; font-weight: 700;
  color: var(--text-em); letter-spacing: -0.01em;
}
.logo-icon { font-size: 1.2rem; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn-icon {
  background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
  cursor: pointer; padding: 8px; border-radius: 10px; font-size: 1rem;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all var(--transition); line-height: 1;
  box-shadow: 0 2px 6px rgba(180,60,70,0.06);
}
.btn-icon:hover {
  color: var(--primary); border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(230,57,70,0.18);
  transform: translateY(-1px);
}
[data-theme="dark"] .btn-icon { background: transparent; box-shadow: none; }
[data-theme="dark"] .btn-icon:hover { color: var(--text-em); background: var(--primary-glow); }

/* ─────────────────────────────────────────────
   Title
───────────────────────────────────────────── */
.title-block {
  text-align: center; margin: 6px 0 22px;
  position: relative; z-index: 2;
}
.title-main {
  font-size: 2.6rem; font-weight: 900;
  color: var(--text-em); letter-spacing: 0.08em;
  line-height: 1.15; margin-bottom: 8px;
  position: relative; display: inline-block;
}
.title-main::before, .title-main::after {
  content: '✦'; color: var(--primary);
  font-size: 0.55em; vertical-align: middle;
  position: absolute; top: 50%; transform: translateY(-55%);
  opacity: 0.7;
}
.title-main::before { left: -1.4em; }
.title-main::after  { right: -1.4em; }
[data-theme="dark"] .title-main { color: var(--text-em); text-shadow: 0 0 24px rgba(0,180,216,0.45); }
[data-theme="dark"] .title-main::before, [data-theme="dark"] .title-main::after { color: var(--gold); }

.title-sub {
  font-size: 0.9rem; color: var(--text-dim);
  letter-spacing: 0.04em;
}

/* ─────────────────────────────────────────────
   Onboarding
───────────────────────────────────────────── */
.onboarding-hint {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
  margin-bottom: 18px; width: 100%; max-width: 720px;
  font-size: 0.85rem; line-height: 1.6;
  color: var(--text); text-align: center;
  box-shadow: var(--shadow-card);
  position: relative; z-index: 2;
}
.onboarding-hint p { margin-bottom: 6px; }
.btn-dismiss {
  background: none; border: 1px solid var(--border); border-radius: 20px;
  padding: 5px 16px; font-size: 0.78rem; color: var(--text-dim);
  cursor: pointer; margin-top: 4px;
  transition: all var(--transition);
}
.btn-dismiss:hover { color: var(--primary); border-color: var(--primary); }

/* ─────────────────────────────────────────────
   Machine layout
───────────────────────────────────────────── */
.machine-wrap {
  width: 100%; max-width: 720px;   /* 與標題/結果卡同寬，使機身水平置中 */
  margin: 0 auto;
  position: relative; z-index: 2;
}

.machine {
  flex: 1; min-width: 0; position: relative;
  background: var(--machine-grad);
  border-radius: 28px;
  padding: 38px 24px 26px;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.30),
    inset 0 -4px 12px rgba(0,0,0,0.25),
    0 24px 50px -16px rgba(155,31,40,0.45),
    0 8px 24px rgba(0,0,0,0.08);
  transition: background var(--transition), box-shadow var(--transition);
}
/* 金邊 */
.machine::before {
  content: ''; position: absolute; inset: 8px;
  border: 2px solid var(--gold);
  border-radius: 22px;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  opacity: 0.85;
}
[data-theme="dark"] .machine {
  border: 2px solid var(--machine-border);
  padding: 24px 22px 20px;
  box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 3px var(--machine-border),
              0 0 60px rgba(0,180,216,0.18), 0 0 20px rgba(0,180,216,0.12),
              inset 0 0 30px rgba(0,180,216,0.06);
}
[data-theme="dark"] .machine::before { display: none; }

/* LUCKY 徽章 */
.lucky-badge {
  position: absolute; top: 0; left: 50%;
  transform: translate(-50%, -55%);
  background: linear-gradient(180deg, #2B3450 0%, #14213D 100%);
  color: var(--gold-bright);
  font-weight: 800; font-size: 0.85rem;
  letter-spacing: 0.28em;
  padding: 7px 30px 7px 34px;
  border-radius: 999px;
  border: 2px solid var(--gold);
  box-shadow: 0 6px 14px rgba(0,0,0,0.28),
              inset 0 1px 0 rgba(255,255,255,0.12);
  z-index: 3;
}
.lucky-badge::before, .lucky-badge::after {
  content: ''; position: absolute; top: 50%;
  width: 22px; height: 2px;
  background: var(--gold); transform: translateY(-50%);
  border-radius: 1px;
}
.lucky-badge::before { left: -28px; }
.lucky-badge::after  { right: -28px; }
[data-theme="dark"] .lucky-badge { display: none; }

/* 機身上方燈 */
.machine-lights {
  display: flex; justify-content: center; gap: 14px;
  margin-bottom: 16px; padding: 0; position: relative; z-index: 2;
}
.light {
  width: var(--light-size); height: var(--light-size);
  border-radius: 50%;
}
.light.r {
  background: radial-gradient(circle at 35% 35%, #ffcfd2, #E63946 60%, #7A0F18);
  box-shadow: 0 0 6px rgba(230,57,70,0.6), inset 0 -1px 2px rgba(0,0,0,0.35);
  animation: blink 1.1s infinite 0.3s;
}
.light.y {
  background: radial-gradient(circle at 35% 35%, #fff3c4, #E8C766 60%, #8B6D1A);
  box-shadow: 0 0 6px rgba(232,199,102,0.7), inset 0 -1px 2px rgba(0,0,0,0.35);
  animation: blink 1.6s infinite;
}
.light.g {
  background: radial-gradient(circle at 35% 35%, #c8f0e6, #2A9D8F 60%, #134E48);
  box-shadow: 0 0 6px rgba(42,157,143,0.5), inset 0 -1px 2px rgba(0,0,0,0.35);
  animation: blink 2.2s infinite 0.7s;
}
.light.p {
  background: radial-gradient(circle at 35% 35%, #ffd9e0, #E63946 60%, #7A0F18);
  box-shadow: 0 0 6px rgba(230,57,70,0.55), inset 0 -1px 2px rgba(0,0,0,0.35);
  animation: blink2 1.9s infinite 1.1s;
}
[data-theme="dark"] .light.r { background: radial-gradient(circle at 35% 35%,#ff8080,#FF4D6D); box-shadow: 0 0 6px 2px #FF4D6D, 0 0 14px 4px rgba(255,77,109,0.4); }
[data-theme="dark"] .light.y { background: radial-gradient(circle at 35% 35%,#ffe080,#FFD166); box-shadow: 0 0 6px 2px #FFD166, 0 0 14px 4px var(--gold-glow); }
[data-theme="dark"] .light.g { background: radial-gradient(circle at 35% 35%,#80ff80,#06D6A0); box-shadow: 0 0 6px 2px #06D6A0, 0 0 14px 4px rgba(6,214,160,0.4); }
[data-theme="dark"] .light.p { background: radial-gradient(circle at 35% 35%,#70E8FF,#00B4D8); box-shadow: 0 0 6px 2px #00B4D8, 0 0 14px 4px rgba(0,180,216,0.4); }

@keyframes blink  { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes blink2 { 0%,100%{opacity:1} 30%{opacity:0.2} 60%{opacity:0.9} 85%{opacity:0.25} }

/* 統計 */
.stats-bar {
  display: flex; align-items: center; gap: 10px;
  margin: 4px 4px 16px; position: relative; z-index: 2;
}
.stats-text {
  font-size: 0.74rem; color: rgba(255,255,255,0.85);
  white-space: nowrap; font-weight: 600; letter-spacing: 0.04em;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.stats-track {
  flex: 1; height: 6px;
  background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px; overflow: hidden;
}
.stats-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-bright), var(--gold));
  border-radius: 4px; transition: width 0.5s ease;
  box-shadow: 0 0 8px rgba(232,199,102,0.5);
}
[data-theme="dark"] .stats-text { color: var(--text-dim); text-shadow: none; }
[data-theme="dark"] .stats-track { background: var(--surface2); border-color: var(--border); }
[data-theme="dark"] .stats-fill { background: linear-gradient(90deg, var(--primary), var(--gold)); box-shadow: 0 0 8px rgba(0,180,216,0.4); }

/* ─────────────────────────────────────────────
   Reels (白色滾輪 + 紅標籤 + 金箭頭)
───────────────────────────────────────────── */
.reels-row {
  display: grid; gap: 10px;
  position: relative; z-index: 2;
}
.reel-col {
  display: flex; flex-direction: column; min-width: 0;
  position: relative; align-items: stretch;
}
/* 紅色滾輪標籤 (滾輪 1/2/3) */
.dim-label {
  align-self: center;
  font-size: 0.68rem; color: #fff; font-weight: 700;
  background: linear-gradient(180deg, #EF4651, #C12C36);
  border-radius: 999px;
  padding: 3px 14px;
  margin-bottom: -10px; position: relative; z-index: 3;
  letter-spacing: 0.06em;
  box-shadow: 0 3px 8px rgba(155,31,40,0.4),
              inset 0 1px 0 rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.25);
  white-space: nowrap; max-width: 90%;
  overflow: hidden; text-overflow: ellipsis;
}
[data-theme="dark"] .dim-label {
  background: none; color: var(--text-dim); font-weight: 600;
  box-shadow: none; border: none;
  margin-bottom: 5px; padding: 0;
  font-size: 0.70rem;
}

.reel-window {
  background: var(--reel-bg);
  border: 3px solid var(--gold-dark);
  border-radius: 14px;
  height: 138px; overflow: hidden;
  position: relative;
  box-shadow:
    inset 0 6px 12px rgba(0,0,0,0.10),
    inset 0 -3px 8px rgba(155,31,40,0.05),
    0 4px 10px rgba(155,31,40,0.18);
  transition: background var(--transition), border-color var(--transition);
}
[data-theme="dark"] .reel-window {
  border: 3px solid var(--border);
  border-color: rgba(0,180,216,0.35);
  background: repeating-linear-gradient(to bottom,
    transparent 0px, transparent 2px,
    rgba(0,180,216,0.04) 2px, rgba(0,180,216,0.04) 4px), var(--reel-bg);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.6),
              inset 0 0 8px rgba(0,180,216,0.08),
              0 0 8px rgba(0,180,216,0.12);
}
/* 上下漸層遮罩 (淡入淡出效果) */
.reel-window::before, .reel-window::after {
  content: ''; position: absolute; left: 0; right: 0;
  height: 44px; z-index: 2; pointer-events: none;
}
.reel-window::before { top: 0;    background: linear-gradient(to bottom, var(--reel-bg) 0%, rgba(250,247,242,0) 100%); }
.reel-window::after  { bottom: 0; background: linear-gradient(to top,    var(--reel-bg) 0%, rgba(250,247,242,0) 100%); }
[data-theme="dark"] .reel-window::before { background: linear-gradient(to bottom, var(--reel-bg), transparent); }
[data-theme="dark"] .reel-window::after  { background: linear-gradient(to top,    var(--reel-bg), transparent); }

/* 中央線 */
.center-line {
  position: absolute; top: 69px; left: 8px; right: 8px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-bright) 50%, var(--gold) 80%, transparent);
  transform: translateY(-50%); z-index: 3;
  pointer-events: none; opacity: 0.75;
}
[data-theme="dark"] .center-line {
  box-shadow: 0 0 6px var(--gold), 0 0 12px rgba(255,209,102,0.4);
}

/* 金色箭頭 (左右指向中心) */
/* 金色三角箭頭：放在 reel-window 內，直接對齊 center-line(top:69px) */
.reel-arrow {
  position: absolute;
  top: 69px; transform: translateY(-50%);
  width: 0; height: 0;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  z-index: 4; pointer-events: none;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
}
.reel-arrow-l { left: 0;  border-left:  10px solid var(--gold-bright); }
.reel-arrow-r { right: 0; border-right: 10px solid var(--gold-bright); }
[data-theme="dark"] .reel-arrow { display: none; }

.reel-track {
  display: flex; flex-direction: column; align-items: center;
  will-change: transform;
}
.reel-item {
  height: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--reel-text); width: 100%; padding: 0 8px;
  text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  font-weight: 800; font-size: 1.45rem;
  letter-spacing: 0.05em;
  transition: color 0.2s;
}
.reel-item.highlight {
  color: var(--primary);
  text-shadow: 0 0 6px rgba(230,57,70,0.25);
}
[data-theme="dark"] .reel-item { font-weight: 500; font-size: 1rem; letter-spacing: normal; }
[data-theme="dark"] .reel-item.highlight {
  color: var(--gold); font-weight: 800;
  text-shadow: 0 0 8px var(--gold), 0 0 18px rgba(255,209,102,0.5);
}

/* ─────────────────────────────────────────────
   SPIN 按鈕（主觸發：實機風格大圓鈕）
───────────────────────────────────────────── */
.spin-row {
  display: flex; justify-content: center;
  margin-top: 22px;
}
.spin-btn {
  width: 92px; height: 92px;
  border-radius: 50%;
  border: 3px solid #B8932E;
  background: radial-gradient(circle at 35% 28%,
    #ffb1b1 0%, #ee424c 40%, #C12C36 72%, #7A0F18 100%);
  color: #fff;
  font-family: inherit;
  font-weight: 900; font-size: 1.25rem;
  letter-spacing: 0.12em; text-indent: 0.12em; /* 置中補償字距 */
  text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  cursor: pointer; user-select: none;
  position: relative;
  transition: filter 0.15s, transform 0.12s;
  animation: spin-breathe 2.6s ease-in-out infinite;
}
@keyframes spin-breathe {
  0%, 100% {
    box-shadow:
      0 8px 18px rgba(155,31,40,0.5),
      0 0 18px rgba(230,57,70,0.22),
      inset -5px -8px 16px rgba(0,0,0,0.28),
      inset 4px 4px 10px rgba(255,255,255,0.28);
  }
  50% {
    box-shadow:
      0 8px 18px rgba(155,31,40,0.5),
      0 0 34px rgba(230,57,70,0.5),
      inset -5px -8px 16px rgba(0,0,0,0.28),
      inset 4px 4px 10px rgba(255,255,255,0.28);
  }
}
.spin-btn:hover:not(:disabled) { filter: brightness(1.08); }
.spin-btn:active:not(:disabled) {
  transform: translateY(3px) scale(0.97);
  filter: brightness(0.96);
}
.spin-btn:disabled {
  cursor: default;
  filter: saturate(0.5) brightness(0.88);
  animation: none;
  box-shadow:
    0 4px 10px rgba(155,31,40,0.35),
    inset -5px -8px 16px rgba(0,0,0,0.28),
    inset 4px 4px 10px rgba(255,255,255,0.18);
}
/* 觸發瞬間的光環（掛在 ::after，不與呼吸光暈打架） */
.spin-btn::after {
  content: ''; position: absolute; inset: -3px;
  border-radius: 50%;
  opacity: 0; pointer-events: none;
}
.spin-btn.pulse::after { animation: ring-pulse 0.7s ease-out forwards; }

/* Dark theme SPIN 按鈕 */
[data-theme="dark"] .spin-btn {
  border-color: rgba(0,180,216,0.65);
  background: radial-gradient(circle at 35% 30%,
    #ff9090 0%, #ee2020 40%, #990000 100%);
  animation: spin-breathe-dark 2.6s ease-in-out infinite;
}
@keyframes spin-breathe-dark {
  0%, 100% {
    box-shadow:
      0 0 15px rgba(255,45,120,0.55), 0 0 30px rgba(255,45,120,0.3),
      inset 0 2px 4px rgba(255,255,255,0.2);
  }
  50% {
    box-shadow:
      0 0 24px rgba(255,45,120,0.85), 0 0 52px rgba(255,45,120,0.45),
      inset 0 2px 4px rgba(255,255,255,0.2);
  }
}
[data-theme="dark"] .spin-btn:disabled {
  animation: none;
  box-shadow: 0 0 10px rgba(255,45,120,0.25), inset 0 2px 4px rgba(255,255,255,0.12);
}
[data-theme="dark"] .spin-btn.pulse::after { animation: ring-pulse-dark 0.7s ease-out forwards; }

/* ─────────────────────────────────────────────
   Action buttons (.btn-action)
───────────────────────────────────────────── */
.btn-action {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 22px;
  font-size: 0.92rem; font-weight: 700;
  border-radius: 12px; cursor: pointer;
  letter-spacing: 0.04em;
  border: 1px solid transparent;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-action:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
.btn-action:disabled { opacity: 0.55; cursor: default; }

.btn-action.primary {
  background: linear-gradient(180deg, #EF4651 0%, #D9303C 50%, #B8222C 100%);
  color: #fff;
  border-color: #9B1F28;
  box-shadow:
    0 6px 14px -4px rgba(155,31,40,0.55),
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -2px 4px rgba(0,0,0,0.15);
  text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}
.btn-action.primary:hover:not(:disabled) {
  filter: brightness(1.08);
  box-shadow: 0 10px 22px -4px rgba(155,31,40,0.6),
              inset 0 1px 0 rgba(255,255,255,0.3);
  transform: translateY(-1px);
}
.btn-action.secondary {
  background: #fff;
  color: var(--text-em);
  border-color: rgba(180,60,70,0.18);
  box-shadow: 0 4px 10px rgba(180,60,70,0.10);
}
.btn-action.secondary:hover:not(:disabled) {
  border-color: var(--primary);
  color: var(--primary);
  transform: translateY(-1px);
  box-shadow: 0 8px 16px rgba(230,57,70,0.18);
}
[data-theme="dark"] .btn-action.primary {
  background: linear-gradient(135deg,#00B4D8 0%,#007A96 100%);
  border-color: transparent;
  box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 20px rgba(0,180,216,0.3);
}
[data-theme="dark"] .btn-action.secondary {
  background: var(--surface2); color: var(--text); border-color: var(--border);
}

/* SVG 圖示 */
.btn-icon-svg { width: 18px; height: 18px; }

/* ─────────────────────────────────────────────
   Result card (本次結果)
───────────────────────────────────────────── */
.result-area {
  width: 100%; max-width: 720px; margin: 22px auto 0;
  display: none;
  animation: fadeUp 0.35s ease;
  position: relative; z-index: 2;
}
.result-area.show { display: block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.result-box {
  background: #FFFFFF;
  border: 1px solid rgba(180,60,70,0.12);
  border-radius: 16px;
  padding: 18px 22px;
  text-align: center;
  box-shadow: 0 8px 24px -8px rgba(180,60,70,0.20),
              0 2px 6px rgba(0,0,0,0.04),
              inset 0 1px 0 rgba(255,255,255,0.9);
  margin-bottom: 12px;
  position: relative;
}
.result-area.show .result-box { animation: win-flash 0.6s ease-out; }
[data-theme="dark"] .result-box {
  background: rgba(0,10,20,0.75);
  border-color: rgba(0,180,216,0.35);
  box-shadow: 0 0 16px rgba(0,180,216,0.12);
}

.result-inline {
  display: inline-flex; align-items: center; gap: 12px;
  flex-wrap: wrap; justify-content: center;
}
.result-icon {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #FF7B7B, #E63946);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.85rem; font-weight: 700;
  box-shadow: 0 3px 8px rgba(230,57,70,0.35);
  flex-shrink: 0;
}
[data-theme="dark"] .result-icon {
  background: linear-gradient(135deg, #70E8FF, #00B4D8);
  box-shadow: 0 0 12px rgba(0,180,216,0.4);
}

.result-label {
  font-size: 0.95rem; color: var(--text-em); font-weight: 700;
  letter-spacing: 0.04em;
}
.result-combo {
  font-size: 1.1rem; font-weight: 800;
  color: var(--primary); word-break: break-word; line-height: 1.4;
  letter-spacing: 0.03em;
}
[data-theme="dark"] .result-combo { color: var(--gold); }

.result-actions {
  display: flex; gap: 10px; justify-content: center;
  margin-top: 4px;
}
.auto-save-control {
  width: 100%; max-width: 720px;
  margin: 14px auto 0;
  display: flex; justify-content: center;
  position: relative; z-index: 2;
}
.auto-save-checkbox {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--text-em); font-size: 0.88rem; font-weight: 700;
  cursor: pointer; user-select: none;
}
.auto-save-checkbox input {
  width: 18px; height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
}
[data-theme="dark"] .auto-save-checkbox { color: var(--text); }
.btn-save {
  background: linear-gradient(180deg, #EF4651, #C12C36);
  color: #fff; border: 1px solid #9B1F28;
  padding: 9px 18px; border-radius: 10px;
  font-size: 0.85rem; font-weight: 700;
  cursor: pointer; letter-spacing: 0.04em;
  box-shadow: 0 4px 10px rgba(155,31,40,0.35),
              inset 0 1px 0 rgba(255,255,255,0.25);
  text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  transition: all var(--transition);
}
.btn-save:hover { filter: brightness(1.08); transform: translateY(-1px); }
[data-theme="dark"] .btn-save {
  background: linear-gradient(135deg,#00B4D8 0%,#007A96 100%);
  border-color: transparent;
  box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 20px rgba(0,180,216,0.3);
}

/* ─────────────────────────────────────────────
   Modals
───────────────────────────────────────────── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 200;
  align-items: center; justify-content: center;
  padding: 16px; backdrop-filter: blur(4px);
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 26px 22px;
  width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: fadeUp 0.28s ease;
}
[data-theme="dark"] .modal {
  box-shadow: 0 0 60px rgba(0,180,216,0.12),
              0 20px 60px rgba(0,0,0,0.8),
              0 0 0 1px rgba(0,180,216,0.18);
}
#settingsModal { align-items: flex-start; }
#settingsModal .modal { margin-top: 16px; max-height: calc(100vh - 32px); }
.modal-head { display: flex; align-items: center; margin-bottom: 18px; gap: 8px; }
.modal-head h2 { font-size: 1.05rem; font-weight: 700; color: var(--text-em); flex: 1; }
.modal-close {
  background: none; border: none; color: var(--text-dim); font-size: 1.2rem;
  cursor: pointer; line-height: 1; padding: 2px 5px; border-radius: 4px;
  transition: color var(--transition);
}
.modal-close:hover { color: var(--red); }

/* Form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
input[type=text],input[type=month],input[type=date],select,textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text-em);
  transition: border-color var(--transition), background var(--transition); outline: none;
}
input[type=date] { padding-right: 4px; }
[data-theme="dark"] input[type=date],
[data-theme="dark"] input[type=month] { color-scheme: dark; }
input:focus,select:focus,textarea:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 110px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: var(--radius-sm); cursor: pointer;
  font-weight: 600; font-size: 0.88rem; padding: 9px 16px;
  transition: all var(--transition);
  white-space: nowrap; width: 100%; margin-top: 8px;
}
.btn:active { transform: scale(0.97) translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.btn-primary {
  background: linear-gradient(180deg, #EF4651 0%, #D9303C 50%, #B8222C 100%);
  color: #fff; border: 1px solid #9B1F28;
  box-shadow: 0 4px 10px rgba(155,31,40,0.35),
              inset 0 1px 0 rgba(255,255,255,0.2);
  text-shadow: 0 1px 2px rgba(0,0,0,0.25); letter-spacing: 0.03em;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 8px 18px rgba(155,31,40,0.4); }
[data-theme="dark"] .btn-primary {
  background: linear-gradient(135deg,#00B4D8 0%,#007A96 100%);
  border-color: transparent;
  box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 20px rgba(0,180,216,0.3);
}
[data-theme="dark"] .btn-primary:hover:not(:disabled) {
  box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 30px rgba(0,180,216,0.55);
}
.btn-secondary {
  background: #fff; color: var(--text-em);
  border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) {
  border-color: var(--primary); color: var(--primary);
  background: rgba(230,57,70,0.04);
}
[data-theme="dark"] .btn-secondary { background: var(--surface2); color: var(--text); }
[data-theme="dark"] .btn-secondary:hover:not(:disabled) { background: var(--primary-glow); }

/* Tabs */
.tab-bar { display: flex; gap: 0; margin-bottom: 18px; border-bottom: 2px solid var(--border); }
.tab-btn {
  flex: 1; padding: 10px 0; background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  color: var(--text-dim); font-weight: 600; font-size: 0.85rem;
  cursor: pointer; transition: all var(--transition);
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Dim Card */
.dim-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px;
}
.dim-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.dim-name-input { flex: 1; font-weight: 700; font-size: 0.9rem; padding: 6px 10px; }
.dim-card-del {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 0.9rem; padding: 4px 6px; border-radius: 4px;
  transition: color var(--transition);
}
.dim-card-del:hover { color: var(--red); }
.dim-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(230,57,70,0.08); border: 1px solid rgba(230,57,70,0.18);
  border-radius: 20px; padding: 4px 10px;
  font-size: 0.82rem; color: var(--text-em);
}
[data-theme="dark"] .chip { background: var(--primary-glow); border-color: rgba(0,180,216,0.25); }
.chip-del {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 0.72rem; line-height: 1; padding: 0 2px;
  transition: color var(--transition);
}
.chip-del:hover { color: var(--red); }
.dim-add-input { width: 100%; padding: 6px 10px; font-size: 0.82rem; }

.import-export-fold { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
.import-export-fold summary { cursor: pointer; font-size: 0.82rem; color: var(--text-dim); font-weight: 500; }
.import-export-fold summary:hover { color: var(--text); }

.date-details { margin-top: 10px; }
.date-details summary { cursor: pointer; font-size: 0.82rem; color: var(--text-dim); font-weight: 500; }
.date-details summary:hover { color: var(--text); }

.backup-hint { text-align: center; margin-top: 10px; font-size: 0.82rem; color: var(--text-dim); display: none; }
.backup-hint.show { display: block; animation: fadeUp 0.3s ease; }
.backup-hint span { display: block; margin-bottom: 4px; }

/* Toggle */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
.toggle-row span { font-size: 0.88rem; color: var(--text); }
.toggle-switch { position: relative; display: inline-flex; align-items: center; flex-shrink: 0; }
.toggle-switch input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle-switch label {
  display: block; width: 44px; height: 24px;
  background: rgba(128,128,128,0.25); border-radius: 12px;
  cursor: pointer; transition: background var(--transition); position: relative;
}
.toggle-switch label::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; background: #fff; border-radius: 50%;
  transition: transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.toggle-switch input:checked + label { background: var(--primary); }
.toggle-switch input:checked + label::after { transform: translateX(20px); }

/* Font size */
.font-size-ctrl { display: flex; align-items: center; gap: 8px; }
.font-size-ctrl button {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text-em);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
  font-size: 1.05rem; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all var(--transition); flex-shrink: 0;
}
.font-size-ctrl button:hover:not(:disabled) { border-color: var(--primary); background: rgba(230,57,70,0.06); }
.font-size-ctrl button:disabled { opacity: 0.3; cursor: default; }
.fs-label { font-size: 0.82rem; color: var(--text-em); min-width: 40px; text-align: center; font-weight: 600; }

/* Table */
.theme-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.theme-table th { background: var(--surface2); padding: 7px 10px; text-align: left; font-weight: 600; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.theme-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text); word-break: break-all; }
.theme-table tr:last-child td { border-bottom: none; }
.theme-table th:last-child, .theme-table td:last-child { width: 52px; text-align: center; }
.history-delete-btn {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 1rem; line-height: 1; padding: 4px;
  border-radius: 6px; transition: all var(--transition);
}
.history-delete-btn:hover { color: var(--red); background: rgba(230,57,70,0.08); }
.empty-hint { text-align: center; color: var(--text-dim); padding: 18px; font-size: 0.88rem; }

/* Toast */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 50px; padding: 9px 22px; font-size: 0.88rem;
  color: var(--text-em); opacity: 0; transition: all 0.3s; z-index: 999;
  box-shadow: var(--shadow-card); max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@keyframes win-flash {
  0%   { box-shadow: 0 8px 24px -8px rgba(180,60,70,0.20); }
  25%  { box-shadow: 0 0 28px rgba(232,199,102,0.6), 0 0 56px rgba(230,57,70,0.3); }
  50%  { box-shadow: 0 8px 24px -8px rgba(180,60,70,0.20); }
  75%  { box-shadow: 0 0 22px rgba(232,199,102,0.5), 0 0 44px rgba(230,57,70,0.25); }
  100% { box-shadow: 0 8px 24px -8px rgba(180,60,70,0.20); }
}

/* ─────────────────────────────────────────────
   背景星芒
───────────────────────────────────────────── */
.sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  line-height: 1; user-select: none;
  will-change: transform, opacity;
  animation: sparkle-anim var(--dur, 3s) var(--dly, 0s) ease-in-out infinite;
}
/* Lucky 主題顏色 */
[data-theme="lucky"] .sparkle[data-c="gold"],
:root:not([data-theme="dark"]) .sparkle[data-c="gold"] {
  color: rgba(232,199,102,0.8);
  text-shadow: 0 0 10px rgba(232,199,102,0.7), 0 0 24px rgba(232,199,102,0.3);
}
[data-theme="lucky"] .sparkle[data-c="red"],
:root:not([data-theme="dark"]) .sparkle[data-c="red"] {
  color: rgba(230,57,70,0.65);
  text-shadow: 0 0 10px rgba(230,57,70,0.5), 0 0 22px rgba(230,57,70,0.2);
}
/* Dark 主題顏色 */
[data-theme="dark"] .sparkle[data-c="gold"] {
  color: rgba(255,209,102,0.5);
  text-shadow: 0 0 10px rgba(255,209,102,0.6);
}
[data-theme="dark"] .sparkle[data-c="red"] {
  color: rgba(0,180,216,0.45);
  text-shadow: 0 0 10px rgba(0,180,216,0.55);
}

@keyframes sparkle-anim {
  0%   { opacity: 0.1;  transform: translateY(0)     scale(0.65) rotate(0deg); }
  20%  { opacity: 0.75; transform: translateY(-5px)  scale(1.05) rotate(18deg); }
  50%  { opacity: 0.95; transform: translateY(-11px) scale(1.2)  rotate(0deg); }
  80%  { opacity: 0.6;  transform: translateY(-5px)  scale(0.95) rotate(-14deg); }
  100% { opacity: 0.1;  transform: translateY(0)     scale(0.65) rotate(5deg); }
}

/* ─────────────────────────────────────────────
   SPIN 觸發特效（光環 + 星星）
───────────────────────────────────────────── */
@keyframes ring-pulse {
  0%   { opacity: 1;
         box-shadow: 0 0 0 0   rgba(244,215,126,1),
                     0 0 10px 0 rgba(244,215,126,0.9); }
  40%  { opacity: 1;
         box-shadow: 0 0 0 14px rgba(232,199,102,0.5),
                     0 0 22px 6px rgba(232,199,102,0.35); }
  100% { opacity: 0;
         box-shadow: 0 0 0 30px rgba(232,199,102,0),
                     0 0 36px 10px rgba(232,199,102,0); }
}
@keyframes ring-pulse-dark {
  0%   { opacity: 1; box-shadow: 0 0 0 0   rgba(0,180,216,0.95), 0 0 10px 0 rgba(0,180,216,0.8); }
  40%  { opacity: 1; box-shadow: 0 0 0 14px rgba(0,180,216,0.4),  0 0 22px 6px rgba(0,180,216,0.3); }
  100% { opacity: 0; box-shadow: 0 0 0 30px rgba(0,180,216,0),    0 0 36px 10px rgba(0,180,216,0); }
}

/* ─── 往下掉的閃亮星星 ─── */
.ball-spark {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  line-height: 1; user-select: none;
  animation: spark-fall var(--dur, 0.8s) var(--dly, 0s) ease-out forwards;
  text-shadow: 0 0 6px currentColor, 0 0 14px currentColor;
}
@keyframes spark-fall {
  0%   { opacity: 1;   transform: translate(0, 0)            scale(1)   rotate(0deg); }
  30%  { opacity: 0.9; }
  100% { opacity: 0;   transform: translate(var(--tx), var(--ty)) scale(0.15) rotate(var(--rot)); }
}

@media (max-width: 599px) {
  :root, [data-theme="lucky"] { --light-size: 8px; }
  html { font-size: 18px; }
  .app-header, .machine-wrap, .result-area { max-width: 100%; }
  .title-main { font-size: 1.9rem; }
  .title-main::before, .title-main::after { display: none; }
  .machine { padding: 30px 16px 20px; }
  .spin-btn { width: 80px; height: 80px; font-size: 1.1rem; }
  .spin-row { margin-top: 18px; }
  .reel-item { font-size: 1.15rem; }
  .btn-action { font-size: 0.88rem; padding: 11px 14px; }
  .result-actions { flex-wrap: wrap; }
}
</style>
</head>
<body>

<!-- 背景星芒容器（JS 動態填入） -->
<div id="sparkleBg" aria-hidden="true"></div>

<!-- Header -->
<header class="app-header">
  <div class="logo">
    <span class="logo-icon">🎰</span>
    <span>主題拉霸機</span>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="btnTheme" title="切換主題">☀️</button>
    <button class="btn-icon" id="btnSettings" title="設定">⚙️</button>
  </div>
</header>

<!-- Title -->
<div class="title-block">
  <div class="title-main">主題拉霸機</div>
  <div class="title-sub">按下「開始」，隨機生成組合</div>
</div>

<!-- 首次引導 -->
<div class="onboarding-hint" id="onboardingHint" style="display:none">
  <p>👋 歡迎！按下下方的「開始」按鈕來隨機抽取組合。</p>
  <p>想自訂拉霸？點右上角 ⚙️ 設定。</p>
  <button class="btn-dismiss" onclick="dismissOnboarding()">知道了</button>
</div>

<!-- Machine -->
<div class="machine-wrap">
  <div class="machine">
    <div class="lucky-badge">LUCKY</div>
    <div class="machine-lights">
      <div class="light p"></div>
      <div class="light r"></div>
      <div class="light y"></div>
      <div class="light g"></div>
      <div class="light y"></div>
      <div class="light r"></div>
      <div class="light p"></div>
    </div>
    <div class="stats-bar">
      <span class="stats-text" id="statsText">0 / 0 組合</span>
      <div class="stats-track"><div class="stats-fill" id="statsFill" style="width:0%"></div></div>
    </div>
    <div class="reels-row" id="reelsRow"></div>
    <div class="spin-row">
      <button class="spin-btn" id="spinBtn" type="button" title="開始抽選">開始</button>
    </div>
  </div>
</div>

<!-- Result card -->
<div class="result-area" id="resultArea">
  <div class="result-box">
    <div class="result-inline">
      <span class="result-icon">✦</span>
      <span class="result-label" id="resultLabel">本次結果：</span>
      <span class="result-combo" id="resultCombo">—</span>
    </div>
  </div>
  <div class="result-actions" id="resultBtns">
    <button class="btn-action secondary" id="btnCopyResult" onclick="copyResult()">
      <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 常數 ────────────────────────────────────────
const DIM_KEY     = 'mdslot_dimensions';
const COMBO_KEY   = 'mdslot_used_combos';
const REPEAT_KEY  = 'mdslot_repeat';
const THEME_KEY   = 'mdslot_ui_theme_lucky';
const FONT_KEY    = 'mdslot_font_scale';
const UNSAVED_KEY = 'mdslot_unsaved_count';
const ONBOARD_KEY = 'mdslot_onboarded';
const DEFAULT_ACK_KEY = 'mdslot_default_dimensions_ack';

const FONT_BASE = 19.5;
const FONT_STEP = 1.5;
const FONT_MIN  = -3;
const FONT_MAX  = 3;

const DEFAULT_DIMENSIONS = [
  { name: '單張/組圖', options: ['單張', '組圖'] },
  { name: '顏色',      options: ['任意','紅','橘','黃','綠','藍','黑白'] },
  { name: '題材',      options: ['建築','紀實','抽象','極簡','風景','靜物','樹木','動物','人像','街拍','品牌','音樂','室內空間'] }
];
const DEFAULT_DIMENSIONS_SIGNATURE = JSON.stringify(DEFAULT_DIMENSIONS);

// ── 資料讀寫 ────────────────────────────────────
function loadDimensions() {
  try { const r = localStorage.getItem(DIM_KEY); if (r) return JSON.parse(r); } catch(e){}
  localStorage.setItem(DEFAULT_ACK_KEY, DEFAULT_DIMENSIONS_SIGNATURE);
  return DEFAULT_DIMENSIONS.map(d => ({ name: d.name, options: [...d.options] }));
}
function saveDimensions(d) { localStorage.setItem(DIM_KEY, JSON.stringify(d)); }
function loadUsedCombos() {
  try { const r = localStorage.getItem(COMBO_KEY); if (r) return JSON.parse(r); } catch(e){}
  return [];
}
function saveUsedCombos(d) { localStorage.setItem(COMBO_KEY, JSON.stringify(d)); }

let dimensions   = loadDimensions();
let usedCombos   = loadUsedCombos();
let allowRepeat  = JSON.parse(localStorage.getItem(REPEAT_KEY) || 'false');
let autoSaveEnabled = true;
let fontScale    = parseInt(localStorage.getItem(FONT_KEY) || '0', 10);
let unsavedCount = parseInt(localStorage.getItem(UNSAVED_KEY) || '0', 10);
let spinning     = false;
let currentCombo = null;
let pendingAutoSave = null;
let reelStates   = [];
let editorDims   = [];

function getDefaultChallengeMonth(date = new Date()) {
  const target = date.getDate() <= 15
    ? new Date(date.getFullYear(), date.getMonth(), 1)
    : new Date(date.getFullYear(), date.getMonth() + 1, 1);
  return `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, '0')}`;
}
function formatChallengeMonth(month) {
  const [y, m] = (month || '').split('-');
  return y && m ? `${y}.${m}` : '';
}
function getMonthPeriod(month) {
  const [y, m] = month.split('-').map(Number);
  return {
    start: `${month}-01`,
    end: `${month}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`
  };
}
function cloneRecord(record) {
  return record ? { ...record, combo: [...record.combo] } : null;
}
function findLastComboRecordIndex(month) {
  for (let i = usedCombos.length - 1; i >= 0; i--) {
    if (usedCombos[i].month === month) return i;
  }
  return -1;
}
function removeComboRecordsByMonth(month) {
  usedCombos = usedCombos.filter(r => r.month !== month);
}
function findComboRecordByMonth(month) {
  const idx = findLastComboRecordIndex(month);
  return { idx, record: idx === -1 ? null : cloneRecord(usedCombos[idx]) };
}
function saveComboRecord(combo, month) {
  const { start, end } = getMonthPeriod(month);
  const record = { combo: [...combo], month, start, end };
  removeComboRecordsByMonth(month);
  usedCombos.push(record);
  saveUsedCombos(usedCombos);
  updateStats();
  unsavedCount++;
  localStorage.setItem(UNSAVED_KEY, String(unsavedCount));
  return record;
}
function restoreComboRecord(month, previousRecord) {
  removeComboRecordsByMonth(month);
  if (previousRecord) usedCombos.push(cloneRecord(previousRecord));
  saveUsedCombos(usedCombos);
  updateStats();
}

// ── 主題切換 (lucky ↔ dark) ─────────────────────
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'lucky';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('btnTheme').textContent = saved === 'dark' ? '☀️' : '🌙';
})();
document.getElementById('btnTheme').addEventListener('click', () => {
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'lucky' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  document.getElementById('btnTheme').textContent = next === 'dark' ? '☀️' : '🌙';
});

// ── 字體大小 ────────────────────────────────────
function applyFontScale() {
  document.documentElement.style.fontSize = (FONT_BASE + fontScale * FONT_STEP) + 'px';
  const label = document.getElementById('fontScaleDisplay');
  if (label) label.textContent = fontScale === 0 ? '預設' : fontScale > 0 ? `＋${fontScale}` : `${fontScale}`;
  const dec = document.getElementById('btnFontDec');
  const inc = document.getElementById('btnFontInc');
  if (dec) dec.disabled = fontScale <= FONT_MIN;
  if (inc) inc.disabled = fontScale >= FONT_MAX;
}
function adjustFontScale(delta) {
  fontScale = Math.max(FONT_MIN, Math.min(FONT_MAX, fontScale + delta));
  localStorage.setItem(FONT_KEY, fontScale);
  applyFontScale();
}

// ── 引導提示 ────────────────────────────────────
function checkOnboarding() {
  if (!localStorage.getItem(ONBOARD_KEY)) {
    document.getElementById('onboardingHint').style.display = '';
  }
}
function dismissOnboarding() {
  localStorage.setItem(ONBOARD_KEY, '1');
  document.getElementById('onboardingHint').style.display = 'none';
}

// ── 多卷軸 DOM ──────────────────────────────────
function buildReelsDOM() {
  const row = document.getElementById('reelsRow');
  row.innerHTML = '';
  reelStates = [];
  const n = dimensions.length;
  if (!n) return;
  row.style.gridTemplateColumns = n <= 4 ? `repeat(${n},1fr)` : 'repeat(3,1fr)';
  const fs = n <= 2 ? '1.6rem' : n === 3 ? '1.45rem' : n === 4 ? '1.15rem' : '0.95rem';
  dimensions.forEach((dim, i) => {
    const col = document.createElement('div');
    col.className = 'reel-col';
    col.innerHTML =
      `<div class="dim-label">${esc(dim.name)}</div>` +
      `<div class="reel-window"><div class="center-line"></div><div class="reel-arrow reel-arrow-l"></div><div class="reel-arrow reel-arrow-r"></div>` +
      `<div class="reel-track" id="reelTrack_${i}"></div></div>`;
    row.appendChild(col);
    reelStates.push({ track: null, reelOffset: 0, totalItems: 0, options: dim.options, fontSize: fs });
  });
}
function initAllReels() {
  dimensions.forEach((dim, i) => {
    const track = document.getElementById('reelTrack_' + i);
    if (!track) return;
    track.innerHTML = '';
    track.style.transform = 'translateY(0)';
    track.style.fontSize  = reelStates[i].fontSize;
    reelStates[i].track      = track;
    reelStates[i].reelOffset = 0;
    reelStates[i].totalItems = 0;
    reelStates[i].options    = dim.options;
    appendReelCyclesForDim(i, 5);
  });
}
function appendReelCyclesForDim(dimIdx, n) {
  const s = reelStates[dimIdx];
  for (let c = 0; c < n; c++)
    for (const opt of s.options) {
      const div = document.createElement('div');
      div.className = 'reel-item';
      div.textContent = opt;
      s.track.appendChild(div);
    }
  s.totalItems += n * s.options.length;
}

// ── 統計 ────────────────────────────────────────
function getTotalCombos() {
  if (!dimensions.length) return 0;
  return dimensions.reduce((a, d) => a * d.options.length, 1);
}
function updateStats() {
  const total = getTotalCombos();
  const used  = usedCombos.length;
  document.getElementById('statsText').textContent = `${used} / ${total} 組合`;
  document.getElementById('statsFill').style.width = total ? `${Math.min((used / total) * 100, 100)}%` : '0%';
}

// ── 笛卡爾積 & 抽籤池 ──────────────────────────
function computeCartesianProduct() {
  if (!dimensions.length) return [];
  return dimensions.reduce((acc, dim) => {
    const out = [];
    for (const a of acc) for (const opt of dim.options) out.push([...a, opt]);
    return out;
  }, [[]]);
}
function getUsedSet() { return new Set(usedCombos.map(r => r.combo.join('|'))); }
function getAvailableCombos() {
  const all = computeCartesianProduct();
  if (allowRepeat) return all;
  const used  = getUsedSet();
  const avail = all.filter(c => !used.has(c.join('|')));
  if (!avail.length) { showToast('所有組合已抽完，重新循環！'); return all; }
  return avail;
}
function pickRandomCombo() {
  if (!dimensions.length) { showToast('請先在設定中建立拉霸！'); return null; }
  const pool = getAvailableCombos();
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

// ── SPIN 按鈕（主觸發） ──────────────────────────
const spinBtn = document.getElementById('spinBtn');

function spinFireEffects() {
  spinBtn.classList.remove('pulse');
  void spinBtn.offsetWidth;
  spinBtn.classList.add('pulse');
  setTimeout(() => spinBtn.classList.remove('pulse'), 700);
  spawnBtnSparkles();
  if (navigator.vibrate) navigator.vibrate(15);
}

spinBtn.addEventListener('click', () => {
  if (spinning) return;
  const combo = pickRandomCombo();
  if (!combo) return;
  spinFireEffects();
  startAllSpins(combo);
});

function spawnBtnSparkles() {
  // 從按鈕中心灑出往下掉的閃亮星星
  const rect = spinBtn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;

  const sparks = [
    { ch: '✦', color: '#F4D77E', tx: -18, ty: 38, dly: '0ms',   dur: '0.75s', rot: '120deg'  },
    { ch: '✦', color: '#E8C766', tx:  22, ty: 52, dly: '40ms',  dur: '0.82s', rot: '-90deg'  },
    { ch: '▴', color: '#FFDF80', tx:  -4, ty: 60, dly: '80ms',  dur: '0.70s', rot: '200deg'  },
    { ch: '✦', color: '#F4D77E', tx:  32, ty: 34, dly: '20ms',  dur: '0.88s', rot: '-150deg' },
    { ch: '▴', color: '#FFD166', tx: -28, ty: 48, dly: '55ms',  dur: '0.78s', rot: '80deg'   },
  ];

  sparks.forEach(s => {
    const el = document.createElement('span');
    el.className = 'ball-spark';
    el.textContent = s.ch;
    const jx = (Math.random() - 0.5) * 28;
    const jy = (Math.random() - 0.5) * 18;
    el.style.cssText =
      `left:${cx + jx}px;top:${cy + jy}px;font-size:${0.55 + Math.random()*0.45}rem;` +
      `color:${s.color};--tx:${s.tx + jx * 0.4}px;--ty:${s.ty}px;` +
      `--dur:${s.dur};--dly:${s.dly};--rot:${s.rot};`;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove(), { once: true });
  });
}

// ── 多卷軸旋轉 ──────────────────────────────────
const ITEM_H = 46, REEL_H = 138, CENTRE_OFFSET = Math.round((REEL_H - ITEM_H) / 2);

function startAllSpins(targetCombo) {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;
  currentCombo = null;
  document.getElementById('resultLabel').textContent = '本次結果：';
  document.getElementById('btnSaveResult').style.display = '';
  document.getElementById('resultArea').classList.remove('show');

  const animParams = dimensions.map((dim, i) => {
    const s = reelStates[i];
    const options   = s.options;
    const chosenIdx = options.indexOf(targetCombo[i]);
    const curCentreRow = Math.round((s.reelOffset + CENTRE_OFFSET) / ITEM_H);
    const minAhead = options.length * 2;
    let targetRow  = curCentreRow + minAhead;
    let diff = chosenIdx - (targetRow % options.length);
    if (diff < 0) diff += options.length;
    targetRow += diff;
    const needed = targetRow + options.length;
    if (needed > s.totalItems) appendReelCyclesForDim(i, Math.ceil((needed - s.totalItems) / options.length) + 1);
    const newOffset = targetRow * ITEM_H - CENTRE_OFFSET;
    return {
      track: s.track, stateRef: s,
      startOffset: s.reelOffset, scrollDist: newOffset - s.reelOffset,
      newOffset, targetRow, duration: 4000, dimIdx: i, done: false
    };
  });

  const startTime = performance.now();
  const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

  function animateAll(now) {
    let allDone = true;
    for (const p of animParams) {
      if (p.done) continue;
      const t = Math.min((now - startTime) / p.duration, 1);
      p.track.style.transform = `translateY(-${p.startOffset + ease(t) * p.scrollDist}px)`;
      if (t < 1) allDone = false;
      else { p.done = true; p.stateRef.reelOffset = p.newOffset; highlightReelForDim(p.dimIdx, p.targetRow); }
    }
    if (!allDone) requestAnimationFrame(animateAll);
    else { spinning = false; spinBtn.disabled = false; currentCombo = targetCombo; showComboResult(targetCombo); }
  }
  requestAnimationFrame(animateAll);
}

function highlightReelForDim(dimIdx, targetRow) {
  const track = document.getElementById('reelTrack_' + dimIdx);
  if (!track) return;
  Array.from(track.children).forEach((el, i) => el.classList.toggle('highlight', i === targetRow));
}
function showComboResult(combo) {
  if (autoSaveEnabled) {
    const month = getDefaultChallengeMonth();
    const beforeSave = findComboRecordByMonth(month);
    const saved = saveComboRecord(combo, month);
    pendingAutoSave = { month, previousRecord: beforeSave.record };
    showLastSaved(saved, { showSaveButton: true });
    return;
  }

  pendingAutoSave = null;
  document.getElementById('resultLabel').textContent = '本次結果：';
  const resultCombo = document.getElementById('resultCombo');
  resultCombo.textContent = combo.join(' / ');
  resultCombo.dataset.month = getDefaultChallengeMonth();
  document.getElementById('btnSaveResult').style.display = '';
  document.getElementById('resultArea').classList.add('show');
}
function showLastSaved(record, { showSaveButton = false } = {}) {
  const [y, m] = (record.month || '').split('-');
  const label = y && m ? `${y}年${m}月組合：` : '上次組合：';
  document.getElementById('resultLabel').textContent = label;
  const resultCombo = document.getElementById('resultCombo');
  resultCombo.textContent = record.combo.join(' / ');
  resultCombo.dataset.month = record.month || '';
  document.getElementById('btnSaveResult').style.display = showSaveButton ? '' : 'none';
  document.getElementById('resultArea').classList.add('show');
  snapReelsToCombo(record.combo);
}
function snapReelsToCombo(combo) {
  dimensions.forEach((dim, i) => {
    const s = reelStates[i];
    if (!s || !s.track) return;
    const idx = s.options.indexOf(combo[i]);
    if (idx === -1) return;
    const targetRow = 2 * s.options.length + idx;
    const needed = targetRow + s.options.length;
    if (needed > s.totalItems) appendReelCyclesForDim(i, Math.ceil((needed - s.totalItems) / s.options.length) + 1);
    const newOffset = targetRow * ITEM_H - CENTRE_OFFSET;
    s.track.style.transform = `translateY(-${newOffset}px)`;
    s.reelOffset = newOffset;
    highlightReelForDim(i, targetRow);
  });
}
function clearResult() {
  currentCombo = null;
  pendingAutoSave = null;
  document.getElementById('resultCombo').dataset.month = '';
  document.getElementById('resultArea').classList.remove('show');
  dimensions.forEach((_, i) => {
    const t = document.getElementById('reelTrack_' + i);
    if (t) Array.from(t.children).forEach(el => el.classList.remove('highlight'));
  });
}

// ── 複製結果 ────────────────────────────────────
function copyResult() {
  const combo = document.getElementById('resultCombo').textContent.trim();
  if (!combo || combo === '—') { showToast('還沒有結果可以複製'); return; }
  const month = formatChallengeMonth(document.getElementById('resultCombo').dataset.month);
  const text = month ? `${month} 主題 ${combo}` : combo;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('✅ 已複製到剪貼簿'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('✅ 已複製到剪貼簿'); }
  catch (e) { showToast('複製失敗'); }
  document.body.removeChild(ta);
}

// ── 存檔 Modal ──────────────────────────────────
function openSaveModal() {
  if (!currentCombo) return;
  document.getElementById('saveComboDisplay').textContent = currentCombo.join(' / ');
  const mv   = getDefaultChallengeMonth();
  const inp  = document.getElementById('saveMonth');
  inp.value  = mv;
  autoFillDates(mv);
  inp.onchange = e => autoFillDates(e.target.value);
  document.getElementById('btnDoSave').disabled = false;
  document.getElementById('backupHint').classList.remove('show');
  document.getElementById('backupHint').innerHTML = '';
  openModal('saveModal');
}
function autoFillDates(mv) {
  if (!mv) return;
  const [y, m] = mv.split('-').map(Number);
  document.getElementById('saveStart').value = `${mv}-01`;
  document.getElementById('saveEnd').value   = `${mv}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`;
}
function doSave() {
  const month = document.getElementById('saveMonth').value;
  if (!month) { showToast('請選擇挑戰月份'); return; }
  if (!currentCombo) return;
  autoFillDates(month);
  if (pendingAutoSave && pendingAutoSave.month !== month) {
    restoreComboRecord(pendingAutoSave.month, pendingAutoSave.previousRecord);
  }
  const saved = saveComboRecord(currentCombo, month);

  showToast(`✅ 已記錄「${currentCombo.join(' / ')}」`);
  document.getElementById('btnDoSave').disabled = true;
  showLastSaved(saved);
  currentCombo = null;
  pendingAutoSave = null;

  if (unsavedCount >= 2) {
    const hint = document.getElementById('backupHint');
    hint.innerHTML =
      `<span>已累積 ${unsavedCount} 次存檔尚未備份</span>` +
      `<button class="btn btn-secondary" onclick="exportAndClose()">📤 匯出備份</button>`;
    hint.classList.add('show');
  } else {
    setTimeout(closeSaveModal, 500);
  }
}
function exportAndClose() {
  downloadFile('主題拉霸機設定.txt', exportConfig());
  unsavedCount = 0;
  localStorage.setItem(UNSAVED_KEY, '0');
  closeSaveModal();
  showToast('已匯出備份');
}
function closeSaveModal() {
  closeModal('saveModal');
  document.getElementById('backupHint').classList.remove('show');
  document.getElementById('backupHint').innerHTML = '';
  document.getElementById('btnDoSave').disabled = false;
}

// ── 匯入/匯出格式 ──────────────────────────────
function exportConfig() {
  const lines = [];
  for (const dim of dimensions) {
    lines.push(`[${dim.name}]`);
    for (const opt of dim.options) lines.push(opt);
    lines.push('');
  }
  if (usedCombos.length) {
    lines.push('[已使用]');
    lines.push('# 格式：組合（|分隔）  挑戰月份  起始日  結束日');
    for (const r of usedCombos) {
      const rest = [r.month, r.start, r.end].filter(Boolean).join('  ');
      lines.push(rest ? `${r.combo.join('|')}  ${rest}` : r.combo.join('|'));
    }
  }
  return lines.join('\n');
}
function parseConfig(text) {
  const dims = [], used = [];
  let curDim = null, inUsed = false;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    if (line === '[已使用]') { inUsed = true; curDim = null; continue; }
    if (/^\[.+\]$/.test(line)) {
      inUsed = false;
      curDim = { name: line.slice(1, -1).trim(), options: [] };
      dims.push(curDim);
      continue;
    }
    if (inUsed) {
      const parts = line.split(/[ \t]{2,}|\t/);
      const combo = parts[0].split('|').map(s => s.trim()).filter(Boolean);
      if (combo.length) used.push({ combo, month: (parts[1]||'').trim(), start: (parts[2]||'').trim(), end: (parts[3]||'').trim() });
    } else if (curDim) {
      curDim.options.push(line);
    }
  }
  return { dims, used };
}
function applyParsedConfig(dims, used) {
  if (!dims.length) { showToast('未找到任何拉霸設定！'); return null; }
  for (const d of dims) if (!d.options.length) { showToast(`拉霸「${d.name}」沒有選項！`); return null; }
  dimensions = dims;
  saveDimensions(dimensions);
  const newN = dimensions.length;
  const validUsed = used.filter(r => r.combo.length === newN && r.combo.every((o, i) => dimensions[i].options.includes(o)));
  const skipped = used.length - validUsed.length;
  usedCombos = validUsed;
  saveUsedCombos(usedCombos);
  buildReelsDOM();
  initAllReels();
  updateStats();
  return { skipped };
}
function downloadFile(name, content) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + content], { type: 'text/plain;charset=utf-8' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportToFile() {
  downloadFile('主題拉霸機設定.txt', exportConfig());
  unsavedCount = 0;
  localStorage.setItem(UNSAVED_KEY, '0');
  showToast('已下載設定檔');
}
function importFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let text = ev.target.result;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const { dims, used } = parseConfig(text.trim());
    const result = applyParsedConfig(dims, used);
    if (!result) return;
    renderDimEditor();
    renderUsedCombos();
    let msg = `已匯入 ${dims.length} 個拉霸、${usedCombos.length} 筆記錄`;
    if (result.skipped) msg += `（略過 ${result.skipped} 筆）`;
    showToast(msg);
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

// ── 設定 Modal ──────────────────────────────────
function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
  document.getElementById(tabId).classList.add('active');
  const modal = document.querySelector('#settingsModal .modal');
  if (modal) modal.scrollTop = 0;
}
function openSettingsModal() {
  renderDimEditor();
  document.getElementById('toggleAllowRepeat').checked = allowRepeat;
  renderUsedCombos();
  switchTab('tabDim');
  openModal('settingsModal');
}

function applyPendingDefaultUpdate() {
  const hasPending = !!localStorage.getItem(DIM_KEY) &&
    localStorage.getItem(DEFAULT_ACK_KEY) !== DEFAULT_DIMENSIONS_SIGNATURE;
  if (!hasPending) return;
  dimensions = DEFAULT_DIMENSIONS.map(d => ({ name: d.name, options: [...d.options] }));
  saveDimensions(dimensions);
  usedCombos = usedCombos.filter(r =>
    r.combo.length === dimensions.length && r.combo.every((o, i) => dimensions[i].options.includes(o))
  );
  saveUsedCombos(usedCombos);
  localStorage.setItem(DEFAULT_ACK_KEY, DEFAULT_DIMENSIONS_SIGNATURE);
  showToast('已套用新的預設值');
}

// ── 卡片式拉霸編輯器 ────────────────────────────
function renderDimEditor() {
  editorDims = dimensions.map(d => ({ name: d.name, options: [...d.options] }));
  rebuildDimCards();
}
function rebuildDimCards() {
  const container = document.getElementById('dimEditor');
  container.innerHTML = '';
  editorDims.forEach((dim, i) => {
    const card = document.createElement('div');
    card.className = 'dim-card';
    card.dataset.idx = i;

    const head = document.createElement('div');
    head.className = 'dim-card-head';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'dim-name-input';
    nameInput.value = dim.name;
    nameInput.placeholder = '拉霸名稱';
    nameInput.oninput = () => { editorDims[i].name = nameInput.value; };
    const delBtn = document.createElement('button');
    delBtn.className = 'dim-card-del';
    delBtn.title = '刪除此拉霸';
    delBtn.textContent = '✕';
    delBtn.onclick = () => removeDimCard(i);
    head.appendChild(nameInput);
    head.appendChild(delBtn);

    const chips = document.createElement('div');
    chips.className = 'dim-chips';
    chips.id = 'dimChips_' + i;
    renderChipsInto(chips, i);

    const addInput = document.createElement('input');
    addInput.type = 'text';
    addInput.className = 'dim-add-input';
    addInput.placeholder = '輸入選項，按 Enter 新增';
    addInput.onkeydown = (e) => {
      if (e.key === 'Enter' && addInput.value.trim()) {
        e.preventDefault();
        if (addChip(i, addInput.value.trim())) {
          addInput.value = '';
          applyDimEditor({ showSuccessToast: false });
        }
      }
    };

    card.appendChild(head);
    card.appendChild(chips);
    card.appendChild(addInput);
    container.appendChild(card);
  });
}
function renderChipsInto(container, dimIdx) {
  container.innerHTML = '';
  editorDims[dimIdx].options.forEach((opt, j) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = opt + ' ';
    const del = document.createElement('button');
    del.className = 'chip-del';
    del.textContent = '✕';
    del.onclick = () => removeChip(dimIdx, j);
    chip.appendChild(del);
    container.appendChild(chip);
  });
}
function addDimCard() {
  editorDims.push({ name: '', options: [] });
  rebuildDimCards();
  const inputs = document.querySelectorAll('.dim-name-input');
  if (inputs.length) inputs[inputs.length - 1].focus();
}
function removeDimCard(idx) {
  editorDims.splice(idx, 1);
  rebuildDimCards();
}
function addChip(dimIdx, value) {
  if (editorDims[dimIdx].options.includes(value)) { showToast('選項已存在'); return false; }
  editorDims[dimIdx].options.push(value);
  const chips = document.getElementById('dimChips_' + dimIdx);
  if (chips) renderChipsInto(chips, dimIdx);
  return true;
}
function removeChip(dimIdx, optIdx) {
  editorDims[dimIdx].options.splice(optIdx, 1);
  const chips = document.getElementById('dimChips_' + dimIdx);
  if (chips) renderChipsInto(chips, dimIdx);
  applyDimEditor({ showSuccessToast: false });
}
function applyDimEditor({ showSuccessToast = false } = {}) {
  const valid = editorDims.filter(d => d.name.trim());
  if (!valid.length) { showToast('請至少設定一個拉霸！'); return; }
  for (const d of valid) if (!d.options.length) { showToast(`拉霸「${d.name}」沒有選項！`); return; }

  const newN = valid.length;
  dimensions = valid.map(d => ({ name: d.name.trim(), options: [...d.options] }));
  saveDimensions(dimensions);

  const validUsed = usedCombos.filter(r =>
    r.combo.length === newN && r.combo.every((o, i) => dimensions[i].options.includes(o))
  );
  const removed = usedCombos.length - validUsed.length;
  usedCombos = validUsed;
  saveUsedCombos(usedCombos);

  buildReelsDOM();
  initAllReels();
  updateStats();
  renderUsedCombos();

  let msg = `已套用 ${dimensions.length} 個拉霸`;
  if (removed) msg += `，清除了 ${removed} 筆不相容的記錄`;
  if (showSuccessToast) showToast(msg);
}

// ── 已使用組合表格 ──────────────────────────────
function renderUsedCombos() {
  const container = document.getElementById('usedCombosTable');
  if (!container) return;
  if (!usedCombos.length) { container.innerHTML = '<div class="empty-hint">尚無使用記錄</div>'; return; }
  let h = '<table class="theme-table"><thead><tr><th>組合</th><th>月份</th><th>期間</th><th></th></tr></thead><tbody>';
  for (const [i, r] of usedCombos.entries()) {
    const period = r.start && r.end ? `${r.start} ~ ${r.end}` : '—';
    h += `<tr><td>${esc(r.combo.join(' / '))}</td><td>${esc(r.month||'—')}</td><td style="white-space:nowrap">${esc(period)}</td><td><button class="history-delete-btn" onclick="removeUsedCombo(${i})" title="刪除此筆記錄" aria-label="刪除此筆記錄">🗑️</button></td></tr>`;
  }
  h += '</tbody></table>';
  container.innerHTML = h;
}
function refreshLastSavedDisplay() {
  if (currentCombo !== null) return;
  if (usedCombos.length > 0) {
    showLastSaved(usedCombos[usedCombos.length - 1]);
  } else {
    document.getElementById('resultArea').classList.remove('show');
  }
}
function removeUsedCombo(idx) {
  const record = usedCombos[idx];
  if (!record) return;
  if (!confirm(`確定要清除此筆記錄？\n${record.combo.join(' / ')}`)) return;
  usedCombos.splice(idx, 1);
  saveUsedCombos(usedCombos);
  updateStats();
  renderUsedCombos();
  refreshLastSavedDisplay();
  showToast('已清除此筆使用記錄');
}
function clearUsedCombos() {
  if (!usedCombos.length) { showToast('沒有使用記錄'); return; }
  if (!confirm(`確定要清除全部 ${usedCombos.length} 筆使用記錄？`)) return;
  usedCombos = [];
  saveUsedCombos(usedCombos);
  updateStats();
  renderUsedCombos();
  refreshLastSavedDisplay();
  showToast('已清除所有使用記錄');
}

// ── Modal helpers ───────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-bg').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target !== el) return;
    if (el.id === 'saveModal') closeSaveModal();
    else el.classList.remove('show');
  });
});
document.getElementById('btnSettings').addEventListener('click', openSettingsModal);

// ── Toast ───────────────────────────────────────
function showToast(msg, ms = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), ms);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 初始化 ──────────────────────────────────────
function init() {
  generateSparkles();
  applyFontScale();
  checkOnboarding();
  applyPendingDefaultUpdate();
  document.getElementById('toggleAutoSave').checked = autoSaveEnabled;
  document.getElementById('toggleAutoSave').addEventListener('change', e => {
    autoSaveEnabled = e.target.checked;
  });
  document.getElementById('toggleAllowRepeat').checked = allowRepeat;
  document.getElementById('toggleAllowRepeat').addEventListener('change', e => {
    allowRepeat = e.target.checked;
    localStorage.setItem(REPEAT_KEY, JSON.stringify(allowRepeat));
  });
  buildReelsDOM();
  initAllReels();
  updateStats();

  if (usedCombos.length > 0) {
    const last = usedCombos[usedCombos.length - 1];
    showLastSaved(last);
  }
}
init();
